services:
  jekyll:
    image: jekyll/builder:pages
    container_name: jekyll-pages-dev

    ports:
      - "4000:4000"

    volumes:
      - .:/srv/jekyll:ro

    tmpfs:
      - /tmp

    environment:
      JEKYLL_ENV: development
      JEKYLL_WATCH: "true"

    working_dir: /srv/jekyll

    command:
      - sh
      - -c
      - |
          gem install webrick --no-document

          exec jekyll serve \
            --source /srv/jekyll/wiki \
            --host 0.0.0.0 \
            --destination /tmp/_site